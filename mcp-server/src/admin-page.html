<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AGS 관리자</title>
<link rel="icon" href="data:,">
<style nonce="__CSP_NONCE__">
:root{
  --bg:#F6F6F3;--fg:#1C1C1A;--muted:#55544F;--line:#DEDDD7;--line2:#ECEBE6;--input:#C9C8C1;--soft:#FBFBF9;
  --pri:#1F4FB8;--pri-d:#163C8C;--pri-l:#E3EAF8;
  --ok-bg:#EEF6EC;--ok-bd:#B9D3B4;--ok-fg:#2B5A24;
  --warn-bg:#FFF4E2;--warn-bd:#E8C48A;--warn-fg:#5C3300;--warn-d:#7A4300;
  --info-bg:#EEF3FC;--info-bd:#B8C8EC;--info-fg:#163C8C;
  --err-bg:#FDECEA;--err-bd:#F0B8B0;--err-fg:#8A1C12;--err-d:#B42318;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
code,.mono,pre{font-family:ui-monospace,Consolas,"D2Coding",monospace;font-size:13px}
[hidden]{display:none!important}
.app{min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:14px 24px;background:#fff;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:18px}
.brand span{font-size:13px;color:var(--muted)}
.grow{flex-grow:1}
.pill{font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid}
.pill.ok{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok-fg)}
.pill.warn{border-color:var(--warn-bd);background:var(--warn-bg);color:var(--warn-d)}
.boot{font-size:12px;color:var(--muted)}
.band{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 24px;border-bottom:1px solid;font-size:14px}
.band>.txt{flex:1 1 320px;min-width:0;overflow-wrap:anywhere}
.band.warn{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn-fg)}
.band.info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info-fg)}
.band.fail,.band.err{background:var(--err-bg);border-color:var(--err-bd);color:var(--err-fg)}
.band .acts{display:flex;flex-wrap:wrap;gap:6px}
.layout{display:flex;flex-wrap:wrap;flex-grow:1;align-content:flex-start}
.row>.al{margin-top:22px}
nav.side{flex:1 1 200px;max-width:240px;padding:20px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--soft)}
.nav-group{font-size:12px;color:var(--muted);padding:12px 10px 4px}
.nav-btn{text-align:left;padding:10px 12px;border-radius:6px;border:0;background:transparent;font-size:14px;cursor:pointer}
.nav-btn:hover{background:#EFEFEA}
.nav-btn[aria-current="page"]{background:var(--pri-l);color:var(--pri-d);font-weight:700}
main{flex:999 1 560px;min-width:0;padding:28px 32px 120px;display:flex;flex-direction:column;gap:24px}
main:focus{outline:none}
.split{display:flex;flex-wrap:wrap;gap:28px}
.split>.col.main-col{flex:999 1 520px}
.split>aside{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px}
.col{min-width:0;display:flex;flex-direction:column;gap:18px}
.head{display:flex;flex-direction:column;gap:6px}
h1{margin:0;font-size:24px}
h2{margin:0;font-size:16px}
h1:focus,h2:focus{outline:none}
.desc{margin:0;font-size:14px;color:var(--muted);line-height:1.6}
.muted{color:var(--muted)}
.small{font-size:12px}
.err-t{color:var(--err-fg)}
.box{padding:16px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:10px}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--input);background:#fff;cursor:pointer;white-space:nowrap}
.btn.sm{padding:6px 12px}
.btn.pri{border-color:var(--pri);background:var(--pri);color:#fff}
.btn.pri-o{border-color:var(--pri);color:var(--pri)}
.btn.dashed{border:1px dashed #8C8B85;background:transparent}
.btn.danger{color:var(--err-fg)}
.btn.link-danger{border:0;background:transparent;color:var(--err-fg);text-decoration:underline;padding:8px 12px}
.btn.warn-o{border-color:var(--warn-d);color:var(--warn-fg)}
.btn.warn-f{border-color:var(--warn-d);background:var(--warn-d);color:#fff}
.btn:disabled{border-color:#B9B8B1;background:#E6E5E0;color:var(--muted);cursor:not-allowed;text-decoration:none}
.txt-in{padding:8px 10px;border:1px solid var(--input);border-radius:6px;background:#fff;min-width:0}
.txt-in.invalid{border:2px solid var(--err-d)}
.hint{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.hint.err{color:var(--err-fg)}
.field{display:flex;flex-direction:column;gap:4px;flex:1 1 280px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start}
.row.center{align-items:center}
.status{font-size:14px}
.status:empty{display:none}
.status.st-busy,.status.st-checking{color:var(--info-fg)}
.status.st-error{color:var(--err-fg)}
.status.st-unknown{color:var(--warn-fg)}
.status.st-ok{color:var(--ok-fg)}
.status.st-info{color:var(--info-fg)}
.status code{margin-left:4px}
.status .btn{margin-left:8px}
.note-ok{padding:12px 16px;border:1px solid var(--ok-bd);background:var(--ok-bg);border-radius:8px;color:var(--ok-fg)}
.note-warn{padding:14px 16px;border:1px solid var(--warn-bd);background:var(--warn-bg);border-radius:8px;color:var(--warn-fg);display:flex;flex-direction:column;gap:10px}
.note-info{padding:12px 16px;border:1px solid var(--info-bd);background:var(--info-bg);border-radius:8px;color:var(--info-fg);display:flex;flex-direction:column;gap:10px}
.note-err{padding:12px 16px;border:1px solid var(--err-bd);background:var(--err-bg);border-radius:8px;color:var(--err-fg);display:flex;flex-direction:column;gap:8px}
.meter-row{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.meter{height:8px;background:#E6E5E0;border-radius:4px;overflow:hidden}
.meter>div{height:100%;width:0;background:var(--pri)}
.meter.over>div{background:var(--err-d)}
.over-t{color:var(--err-fg);font-weight:700}
ol.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
ol.rules li{padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;gap:8px}
ol.rules label{font-size:13px;color:var(--muted)}
ol.rules textarea{width:100%;padding:8px 10px;border:1px solid var(--input);border-radius:6px;resize:vertical;line-height:1.6}
.rule-foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;font-size:12px;color:var(--muted)}
ul.hist{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.hist-btn{width:100%;text-align:left;padding:10px 12px;border:1px solid transparent;border-radius:6px;background:#fff;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.hist-btn[aria-pressed="true"]{border-color:var(--pri);background:var(--pri-l)}
.hist-btn .t{font-size:14px;font-weight:500}
.tag{display:inline-block;font-size:12px;padding:0 6px;margin-left:6px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-weight:400}
.tag.new{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok-fg);font-weight:700}
.diff{margin:0;padding:8px 0;background:#fff;border:1px solid var(--line2);border-radius:6px;max-height:360px;overflow:auto}
.diff div{padding:0 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.diff .add{background:#E9F5E6;color:var(--ok-fg)}
.diff .del{background:#FBE9E7;color:var(--err-fg)}
.cmp{display:flex;flex-wrap:wrap;gap:12px}
.cmp>div{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:4px}
.cmp pre,pre.body{margin:0;padding:12px;background:var(--bg);border:1px solid var(--line2);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;max-height:320px;overflow:auto;color:var(--fg)}
.tbl-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%}
.tbl-wrap table{min-width:760px}
.tbl-wrap td:first-child{min-width:180px}
.tbl-wrap td:nth-child(4){min-width:150px}
caption{text-align:left;padding:12px;font-size:14px;font-weight:700}
th{text-align:left;font-weight:500;font-size:13px;color:var(--muted);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px;border-bottom:1px solid var(--line2);font-size:14px;vertical-align:top}
td.nowrap{white-space:nowrap}
td .acts{display:flex;flex-wrap:nowrap;gap:6px;align-items:center}
td .acts .small{white-space:normal;min-width:160px}
.empty{margin:0;padding:24px;text-align:center;background:#fff;border:1px dashed var(--input);border-radius:8px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip-r{padding:6px 12px;border-radius:999px;border:1px solid var(--input);background:#fff;font-size:13px;cursor:pointer}
.chip-r[aria-checked="true"]{border-color:var(--pri);background:var(--pri-l);color:var(--pri-d);font-weight:700}
ul.cards{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.card{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:16px 18px;background:#fff;border-radius:8px;border:1px solid var(--line)}
.card.req{border-color:#8FA9E0;box-shadow:inset 4px 0 0 var(--pri)}
.card .c1{flex:1 1 360px;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .c2{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:4px}
.card .c3{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.card .c4{flex:1 1 100%}
.card .ttl{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.card .doing{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.card .ids{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.role-t{font-size:15px;overflow-wrap:anywhere}
.role-t.bound{font-weight:700}
.role-t.req{font-weight:700;color:var(--info-fg)}
.role-t.none{color:var(--muted)}
.st{font-size:12px;padding:2px 8px;border-radius:999px;border:1px solid}
.st.on{background:var(--ok-bg);color:var(--ok-fg);border-color:var(--ok-bd)}
.st.off{background:#EFEFEC;color:var(--muted);border-color:var(--input)}
.st.warn{background:var(--warn-bg);color:var(--warn-fg);border-color:var(--warn-bd)}
details.guide{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--pri);width:fit-content}
details.guide ul{margin:8px 0 0;padding-left:18px;line-height:1.7}
dl.kv{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:14px;line-height:1.5}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.savebar{position:sticky;bottom:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 24px;background:#fff;border-top:1px solid var(--line);z-index:5}
.savebar .txt{flex:1 1 280px;min-width:0;display:flex;flex-direction:column;gap:2px}
dialog.dlg{width:min(560px,calc(100vw - 32px));padding:24px;border:0;border-radius:10px;background:#fff;color:var(--fg)}
dialog.dlg.narrow{width:min(480px,calc(100vw - 32px))}
dialog.dlg.combo-host{overflow:visible}
dialog::backdrop{background:rgba(20,20,18,.45)}
.dlg-in{display:flex;flex-direction:column;gap:14px}
.dlg-in h2{font-size:18px}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;align-items:center}
.dlg-acts .why{flex:1 1 100%;text-align:right}
.dlg-acts .why:empty{display:none}
.del-list{margin:8px 0 0;padding:8px 12px;list-style:none;max-height:160px;overflow-y:auto;border:1px solid var(--line2);border-radius:6px;background:var(--soft);display:flex;flex-direction:column;gap:4px}
.del-list li{overflow-wrap:anywhere}
.combo{position:relative}
.combo input{width:100%;padding:10px 36px 10px 12px;border:1px solid #8C8B85;border-radius:6px;font-size:15px;background:#fff;cursor:pointer}
.combo .chev{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--muted);font-size:12px}
.combo-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:10;border:1px solid var(--input);border-radius:6px;background:#fff;box-shadow:0 8px 20px rgba(20,20,18,.14);overflow:hidden}
.combo-pop ul{margin:0;padding:4px;list-style:none;max-height:220px;overflow-y:auto}
.combo-pop li[role="option"]{display:flex;flex-direction:column;gap:2px;padding:8px 10px;border-radius:4px;cursor:pointer}
.combo-pop li[role="option"][aria-selected="true"]{background:var(--pri-l)}
.combo-pop li.active{outline:2px solid var(--pri);outline-offset:-2px}
.combo-pop li .n{font-size:14px;font-weight:500;overflow-wrap:anywhere}
.combo-pop li.nomatch{padding:10px;font-size:13px;color:var(--muted)}
.combo-foot{padding:6px 12px;border-top:1px solid var(--line2);font-size:12px;color:var(--muted);background:var(--soft)}
.picked{padding:10px 12px;border:1px solid var(--info-bd);background:#F3F6FD;border-radius:6px;display:flex;flex-direction:column;gap:2px}
.picked b{font-size:15px;overflow-wrap:anywhere}
select:disabled{background:#EFEFEC}
ul.paths{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
ul.paths li{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:8px 10px;border:1px solid var(--line2);border-radius:6px}
ul.paths code{flex:1 1 240px;min-width:0;overflow-wrap:anywhere}
input[type="checkbox"][role="switch"]{width:20px;height:20px;margin:0}
@media (max-width:760px){
  header.top{padding:12px 16px}
  .band{padding:10px 16px}
  nav.side{max-width:none;flex:1 1 100%;flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line)}
  .nav-group{display:none}
  .nav-btn{padding:8px 10px}
  main{padding:20px 16px 120px}
  .savebar{padding:12px 16px}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">

  <div id="bands"></div>
  <div class="layout">
    <nav class="side" id="nav" aria-label="관리 항목"></nav>
    <main id="main" tabindex="-1"><p class="muted">불러오는 중…</p></main>
  </div>
  <div class="savebar" id="savebar" hidden></div>
</div>
<noscript>이 페이지는 JavaScript가 있어야 동작합니다.</noscript>

    ADMIN_LOG_REGRESSED: '저장 기록이 이전보다 줄었습니다(되돌려진 흔적). 사용자가 직접 확인해야 합니다.',
    REQUEST_TOO_LARGE: '요청이 너무 큽니다(64KiB 상한).',
    CONTENT_TYPE_REJECTED: '요청 형식(Content-Type)을 서버가 받지 않습니다.',
    STORE_UNAVAILABLE: '저장소를 읽거나 쓸 수 없습니다.',
    NETWORK: '관리자 서버에 연결할 수 없습니다.',
    BAD_RESPONSE: '서버 응답을 읽을 수 없습니다.',
    WEBAUTHN_UNSUPPORTED: '이 브라우저는 패스키(WebAuthn)를 지원하지 않습니다.',
  };
  const REASON = {
    ROLE_NAME_TAKEN: '같은 이름(대소문자 무시)의 역할이 이미 있습니다.',
    ROLE_ID_TAKEN: '역할 ID가 겹쳤습니다. 다시 시도하세요.',
    ROLE_NOT_FOUND: '역할이 이미 없어졌습니다.',
    KEY_ALREADY_KNOWN: '이미 등록된 패스키입니다.',
    TOO_LARGE: '크기 상한을 넘었습니다.',
    TARGET_MISMATCH: '요청한 대상과 변경 대상이 다릅니다.',
    JEV_PRESET_UNKNOWN: '이 설치에 없는 프리셋입니다.',
    JEV_KEY_NOT_FOUND: '등록된 key가 없습니다.',
    JEV_KEY_FINGERPRINT_MISMATCH: '보낸 key 값이 서명한 지문과 다릅니다.',
    SECRET_UNEXPECTED: 'key 값은 key 등록에만 보낼 수 있습니다.',
    JEV_KEY_VAULT_UNAVAILABLE: 'key를 암호화해 저장할 수 없습니다(상태 폴더를 쓸 수 없음).',
  };
  const SIGN_CODES = new Set(['ADMIN_SIGNATURE_INVALID', 'ADMIN_CHALLENGE_MISMATCH', 'ADMIN_RPID_MISMATCH', 'ADMIN_USER_VERIFICATION_MISSING',
    'ADMIN_ALGORITHM_UNSUPPORTED', 'ADMIN_KEY_UNKNOWN', 'ADMIN_KEY_REVOKED', 'ADMIN_KEY_NOT_REGISTERED', 'ADMIN_INTENT_NONCANONICAL', 'ADMIN_INTENT_EXPIRED']);
  function describe(code, details) {
    let m = MSG[code] || '알 수 없는 오류입니다.';
    const reason = details && details.reason;
    if (reason) m += ' ' + (REASON[reason] || '사유: ' + reason);
    return m;
  }
  const codeText = (code, details) => code + (details && details.reason ? ' / ' + details.reason : '');

  // ---------- 서버 호출 ----------
  async function api(method, path, body) {
    let res;
    try {
      res = await fetch(path, {
        method, cache: 'no-store', credentials: 'same-origin',
        headers: body === undefined ? undefined : { 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body),
      });
    } catch (e) { throw { kind: 'NETWORK' }; }
    let json;
    try { json = await res.json(); } catch (e) { throw { kind: 'BAD_RESPONSE', status: res.status }; }
    return { ok: res.ok, status: res.status, json };
  }
  function errOf(r) {
    const e = r.json && r.json.error;
    return { code: (e && e.code) || 'HTTP_' + r.status, details: (e && e.details) || {} };
  }

  async function loadState() {
    const seq = ++loadSeq;
    let r;
    try { r = await api('GET', '/api/state'); }
    catch (e) { if (seq === loadSeq) { S.loadError = { code: e.kind, details: {} }; render(); } return false; }
    if (seq !== loadSeq) return false; // 늦게 온 이전 응답은 버린다
    if (!r.ok) {
      S.loadError = errOf(r);
      if (S.loadError.code === 'STORE_UNAVAILABLE') S.storeError = S.loadError;
      render(); return false;
    }
    S.loadError = null; S.storeError = null;
    applyState(r.json);
    render();
    return true;
  }

  // ---------- 전역 컨텍스트 편집 모델 ----------
  const splitRules = (body) => (body ? String(body).split('\n\n') : []);
  const joinRules = (texts) => texts.filter((t) => t.trim() !== '').join('\n\n');
  const mkRule = (text) => ({ id: 'rule-' + (++ruleSeq), text });
  const editTexts = () => S.g.rules.map((r) => r.text);
  const editBody = () => joinRules(editTexts());
  const isGlobalDirty = () => S.g.init && editBody() !== joinRules(S.g.baseRules);
  function resetGlobal(body, token) {
    S.g.baseRules = splitRules(body);
    S.g.rules = S.g.baseRules.map(mkRule);
    S.g.baseToken = token; S.g.conflict = false; S.g.compareOpen = false; S.g.init = true;
  }
  function changeCount() {
    const base = S.g.baseRules.filter((t) => t.trim() !== ''), mine = editTexts().filter((t) => t.trim() !== '');
    const b = base.slice(); let added = 0;
    for (const t of mine) { const i = b.indexOf(t); if (i >= 0) b.splice(i, 1); else added++; }
    return Math.max(added, b.length);
  }

  function applyState(d) {
    for (const k of ['keys', 'resets', 'globalHistory', 'roles', 'sessions', 'proposals', 'failures']) if (!Array.isArray(d[k])) d[k] = [];
    S.data = d;
    const body = d.global ? d.global.body : '';
    const token = d.global ? d.global.stateToken : null;
    if (!S.g.init || !isGlobalDirty()) resetGlobal(body, token);
    else if (token !== S.g.baseToken) {
      // 내 편집이 이미 최신과 같으면(방금 내가 저장) 충돌이 아니다.
      if (editBody() === joinRules(splitRules(body))) resetGlobal(body, token);
      else S.g.conflict = true;
    }
    if (S.r.renaming && !d.roles.some((r) => r.roleId === S.r.renaming.roleId)) S.r.renaming = null;
    syncSettings(d);
  }
  function reapplyMine() {
    // ceiling: 규칙(빈 줄 단위) 3방향 병합. 다른 경로가 추가한 규칙은 끝에 붙는다(순서 보존 안 함).
    const base = S.g.baseRules, mine = editTexts();
    const latestBody = S.data.global ? S.data.global.body : '';
    const latest = splitRules(latestBody);
    const out = [];
    for (const t of mine) { if (base.includes(t)) { if (latest.includes(t)) out.push(t); } else out.push(t); }
    for (const t of latest) if (!base.includes(t) && !out.includes(t)) out.push(t);
    S.g.baseRules = latest; S.g.baseToken = S.data.global ? S.data.global.stateToken : null;
    S.g.rules = out.map(mkRule); S.g.conflict = false; S.g.compareOpen = false;
    setStatus('global', { kind: 'info', text: '최신 판 r' + (S.data.global ? S.data.global.revision : 0) + ' 위에 내 변경을 다시 적용했습니다. 내용을 확인한 뒤 저장하세요.' });
  }

  // ---------- 줄 단위 비교 ----------
  function lineDiff(a, b) {
    // ceiling: O(n·m) LCS. 본문이 2,000 byte 이하라 충분하다.
    const A = String(a).split('\n'), B = String(b).split('\n'), n = A.length, m = B.length;
    const dp = Array.from({ length: n + 1 }, () => new Uint32Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    const out = []; let i = 0, j = 0;
    while (i < n && j < m) {
      if (A[i] === B[j]) { out.push([' ', A[i]]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) out.push(['-', A[i++]]);
      else out.push(['+', B[j++]]);
    }
    while (i < n) out.push(['-', A[i++]]);
    while (j < m) out.push(['+', B[j++]]);
    return out;
  }
  function diffView(a, b, label) {
    const rows = lineDiff(a, b);
    return h('div', { class: 'diff', role: 'region', 'aria-label': label, tabindex: '0' },
      rows.map(([t, s]) => h('div', { class: t === '+' ? 'add' : t === '-' ? 'del' : '' }, (t === '+' ? '+ ' : t === '-' ? '− ' : '  ') + s)));
  }
  function compareView(leftTitle, left, rightTitle, right) {
    return h('div', { class: 'cmp' },
      h('div', null, h('span', { class: 'small muted' }, leftTitle), h('pre', { tabindex: '0' }, left || '(비어 있음)')),
      h('div', null, h('span', { class: 'small muted' }, rightTitle), h('pre', { tabindex: '0' }, right || '(비어 있음)')));
  }

  // ---------- 저장 상태 표시 ----------
  function setStatus(slot, st) { if (st) S.status[slot] = st; else delete S.status[slot]; render(); }
  const slotBlocked = (slot) => { const st = S.status[slot]; return !!st && (st.kind === 'checking' || st.kind === 'unknown'); };
  function statusEl(slot) {
    const st = S.status[slot];
    const box = h('div', { id: 'st-' + idSafe(slot), class: 'status' + (st ? ' st-' + st.kind : ''), role: 'status', 'aria-live': 'polite' });
    if (st) {
      box.append(h('span', null, st.text));
      if (st.code) box.append(h('code', null, st.code));
      if (st.retry) box.append(h('button', { type: 'button', class: 'btn sm', id: 'retry-' + idSafe(slot), onclick: st.retry, disabled: !!S.busy }, '다시 확인'));
    }
    return box;
  }
  const hasKeys = () => !!(S.data && S.data.keys.length);
  // 패스키 서명이 필요한 버튼
  function signBtn(o) {
    const off = !!S.busy || !hasKeys() || slotBlocked(o.slot) || !!o.off;
    return h('button', { type: 'button', id: o.id, class: 'btn ' + (o.cls || 'pri'), disabled: off, onclick: o.onclick, 'aria-describedby': o.why || null },
      S.busy === o.slot ? '저장 중…' : o.label);
  }

  function webauthnFail(slot, e, cancelText) {
    const name = (e && e.name) || 'Error';
    let text;
    if (name === 'NotAllowedError' || name === 'AbortError') text = cancelText || '패스키 확인을 취소했습니다(또는 시간이 지났습니다). 변경은 그대로 있습니다.';
    else if (name === 'InvalidStateError') text = '이 인증기에는 이미 이 사이트용 패스키가 있습니다.';
    else if (name === 'SecurityError') text = '브라우저가 보안 문제로 패스키를 막았습니다. 주소가 http://localhost:… 인지 확인하세요.';
    else if (name === 'NotSupportedError') text = '이 인증기는 지원하는 서명 방식이 없습니다.';
    else text = '패스키 확인에 실패했습니다. 변경은 그대로 있습니다.';
    setStatus(slot, { kind: 'error', text, code: name });
  }
  function httpFail(slot, r) {
    const { code, details } = errOf(r);
    if (code === 'STORE_UNAVAILABLE') S.storeError = { code, details };
    const pre = SIGN_CODES.has(code) ? '패스키 확인에 실패했습니다. ' : '저장하지 못했습니다. ';
    setStatus(slot, { kind: 'error', text: pre + describe(code, details) + ' 변경은 그대로 있습니다.', code: codeText(code, details) });
    return code;
  }

  // 서명해서 저장: intent → 패스키 get() → commit. 응답 불명이면 같은 requestId로 조회만 한다.
  async function runSigned(o) {
    if (S.busy) return;
    const slot = o.slot;
    S.busy = slot;
    setStatus(slot, { kind: 'busy', text: '저장을 준비하는 중…' });
    try {
      if (!window.PublicKeyCredential || !navigator.credentials) { setStatus(slot, { kind: 'error', text: MSG.WEBAUTHN_UNSUPPORTED, code: 'WEBAUTHN_UNSUPPORTED' }); return; }
      let r;
      try { r = await api('POST', '/api/intent', { change: o.change, bootstrap: !!o.bootstrap, ...(o.baseHash !== undefined ? { baseHash: o.baseHash } : {}) }); }
      catch (e) { setStatus(slot, { kind: 'error', text: '저장하지 못했습니다. ' + MSG[e.kind] + ' 아무것도 보내지 않았고 변경은 그대로 있습니다.', code: e.kind }); return; }
      if (!r.ok) { const code = httpFail(slot, r); if (code === 'ADMIN_TARGET_STALE' && o.onStale) await o.onStale(); return; }
      const { intent, challenge, allowCredentials } = r.json;
      setStatus(slot, { kind: 'busy', text: '패스키 창에서 본인 확인을 해 주세요…' });
      let cred;
      try {
        cred = await navigator.credentials.get({ publicKey: {
          challenge: b64u.dec(challenge), rpId: S.data.rpId,
          allowCredentials: (o.allow || allowCredentials || []).map((id) => ({ type: 'public-key', id: b64u.dec(id) })),
          userVerification: 'required', timeout: 120000 } });
      } catch (e) { webauthnFail(slot, e, o.cancelText); return; }
      if (!cred) { webauthnFail(slot, { name: 'NotAllowedError' }, o.cancelText); return; }
      const a = cred.response;
      const assertion = { credentialId: b64u.enc(cred.rawId), authenticatorData: b64u.enc(a.authenticatorData), clientDataJSON: b64u.enc(a.clientDataJSON), signature: b64u.enc(a.signature) };
      const requestId = crypto.randomUUID();
      setStatus(slot, { kind: 'busy', text: '저장 중…' });
      let c;
      // key 값은 서명한 등록과 함께 한 번만 보낸다(서버는 암호화해 두고 다시 보내지 않는다).
      try { c = await api('POST', '/api/commit', { intent, assertion, requestId, proposalId: o.proposalId || null, ...(o.secret ? { secret: o.secret } : {}) }); }
      catch (e) { S.busy = null; await checkUnknown(slot, requestId, o.onDone); return; }
      if (!c.ok) { const code = httpFail(slot, c); if (code === 'ADMIN_TARGET_STALE' && o.onStale) await o.onStale(); return; }
      if (!c.json || !c.json.record) { S.busy = null; await checkUnknown(slot, requestId, o.onDone); return; }
      S.busy = null;
      await finish(slot, c.json.record, o.onDone);
    } finally {
      if (S.busy === slot) { S.busy = null; render(); }
    }
  }
  async function checkUnknown(slot, requestId, onDone) {
    S.busy = slot;
    setStatus(slot, { kind: 'checking', text: '저장 결과를 확인하는 중입니다…' });
    let r = null;
    try { r = await api('GET', '/api/request/' + encodeURIComponent(requestId)); } catch (e) { r = null; }
    S.busy = null;
    if (!r || !r.ok) {
      setStatus(slot, { kind: 'unknown', text: '저장 결과를 확인하지 못했습니다. 같은 요청을 다시 보내지 않았습니다. 서버가 다시 응답하면 [다시 확인]을 누르세요.', code: 'request ' + short(requestId), retry: () => checkUnknown(slot, requestId, onDone) });
      return;
    }
    if (r.json && r.json.record) { await finish(slot, r.json.record, onDone); return; }
    setStatus(slot, { kind: 'error', text: '저장되지 않았습니다. 변경은 그대로 있습니다. 다시 저장할 수 있습니다.' });
  }
  async function finish(slot, record, onDone) {
    delete S.status[slot];
    const loaded = await loadState();
    if (onDone) onDone(record, loaded);
    if (!loaded) setStatus(slot, { kind: 'ok', text: '저장됨 · 기록 #' + record.seq + ' · ' + fmtHM(record.createdAt) + '. 최신 상태를 불러오지 못했습니다. [다시 불러오기]를 누르세요.' });
    render();
  }

  // ---------- localStorage (이 브라우저가 등록한 패스키) ----------
  function lsRead() {
    try { const v = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); return Array.isArray(v) ? v.filter((x) => typeof x === 'string') : []; }
    catch (e) { return null; }
  }
  function lsWrite(list) { try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch (e) { /* 저장소를 쓸 수 없으면 기억만 못 한다 */ } }
  function remember(id) { const l = lsRead() || []; if (!l.includes(id)) { l.push(id); lsWrite(l); } }
  function forget(id) { const l = lsRead(); if (l) lsWrite(l.filter((x) => x !== id)); }

  // ---------- 화면 공통 ----------
  const TABS = [
    { key: 'global', label: '전역 컨텍스트', group: '컨텍스트' },
    { key: 'roles', label: '역할' },
    { key: 'bindings', label: '세션 결속' },
    { key: 'jev', label: 'JEV', group: '도구' },
    { key: 'general', label: '일반 설정' },
    { key: 'passkey', label: '패스키', group: '보안' },
  ];
  function go(tab, focusId) {

  }
  function head(id, title, desc) {

  }
  const globalProposals = () => S.data.proposals.filter((p) => p.target === 'global' || (p.change && p.change.op === 'global.set'));
  const bindingProposals = () => S.data.proposals.filter((p) => p.change && p.change.op === 'binding.set')
    .slice().sort((x, y) => String(y.createdAt).localeCompare(String(x.createdAt)));

  const roleName = (id) => { const r = roleById(id); return r ? r.name : '알 수 없는 역할(' + short(id) + ')'; };

  function render() {
    const ae = document.activeElement;
    const inDialog = !!(ae && ae.closest && ae.closest('dialog'));
    const fid = !inDialog && ae && ae !== document.body ? ae.id : null;
    let sel = null;
    if (fid) { try { if (typeof ae.selectionStart === 'number') sel = [ae.selectionStart, ae.selectionEnd]; } catch (e) { sel = null; } }
    renderTop(); renderBands(); renderNav(); renderMain(); renderSaveBar();
    if (S.dialog && S.dialog.refresh) S.dialog.refresh();
    if (fid) {

      }
    }
  }

  function renderTop() {
    const top = $('top');
    const kids = [h('div', { class: 'brand' }, h('b', null, 'AGS 관리자'), h('span', null, '· 이 PC 전용')), h('div', { class: 'grow' })];
    if (S.data) {
      const d = S.data;
      if (d.bootstrap) kids.push(h('span', { class: 'boot' }, '최초 등록 ' + fmtTime(d.bootstrap.at) + ' · 지문 ', h('code', null, d.bootstrap.fingerprint)));
      kids.push(d.keys.length
        ? h('span', { class: 'pill ok' }, '패스키 ' + d.keys.length + '개 등록됨 · 저장할 때 확인')

  }

  const LAYER = { global: '전역 컨텍스트', keys: '패스키 목록', roles: '역할', binding: '세션 결속', jev: 'JEV 설정', jevKeys: 'JEV key', locale: '표시 언어', editExempt: '편집 관문 예외 경로' };
  function renderBands() {
    const out = [];
    const err = S.storeError || S.loadError;
    if (err) {
      out.push(h('div', { class: 'band err', role: 'alert' },
        h('span', { class: 'txt' }, (err.code === 'STORE_UNAVAILABLE' ? '저장소를 읽을 수 없습니다. ' : '상태를 불러오지 못했습니다. ') + describe(err.code, err.details) + ' 편집 중인 내용은 그대로 있습니다. ', h('code', null, codeText(err.code, err.details))),
        h('div', { class: 'acts' }, h('button', { type: 'button', class: 'btn sm', id: 'reload-top', onclick: () => loadState() }, '다시 불러오기'))));
    }
    if (S.data) {
      const d = S.data;
      for (const f of d.failures) {
        const slot = 'fail-' + f.target;
        const acts = h('div', { class: 'acts' },

  const EX_HINT = '목록을 고친 뒤 [패스키로 저장]을 눌러야 적용됩니다.';
  function exemptAddError(raw, cur, max) {
    return !raw ? null : !looksAbsolute(raw) ? '절대 경로를 입력하세요(예: D:' + BS + 'work' + BS + 'notes, /home/me/notes).'
      : cur.includes(raw) ? '이미 목록에 있습니다.' : cur.length >= max ? '최대 ' + max + '개까지 넣을 수 있습니다.' : null;
  }
  const BS = String.fromCharCode(92);
  function viewExempt(ex) {
    const cur = S.ex.cur || [], dirty = isExemptDirty(), locked = !ex.editable;
    const raw = S.ex.newPath.trim();
    const addErr = exemptAddError(raw, cur, ex.maxPaths);
    const add = () => {
      const value = S.ex.newPath.trim();
      if (!value || exemptAddError(value, cur, ex.maxPaths)) return;
      cur.push(value); S.ex.cur = cur; S.ex.newPath = ''; delete S.status.exempt; render(); const f = $('ex-new'); if (f) f.focus();
    };
    const inp = h('input', { id: 'ex-new', type: 'text', class: 'txt-in' + (addErr ? ' invalid' : ''), autocomplete: 'off', spellcheck: 'false', value: S.ex.newPath,
      disabled: locked, placeholder: '예: D:\\work\\reports', 'aria-invalid': addErr ? 'true' : 'false', 'aria-describedby': 'ex-hint' });
    // 입력 중에는 화면을 다시 그리지 않는다(IME 조합 보존). 안내와 버튼만 고친다.
    inp.addEventListener('input', () => {
      S.ex.newPath = inp.value;
      const c = exemptAddError(S.ex.newPath.trim(), cur, ex.maxPaths), hint = $('ex-hint'), btn = $('ex-add');
      inp.classList.toggle('invalid', !!c); inp.setAttribute('aria-invalid', c ? 'true' : 'false');
      if (hint) { hint.className = 'hint' + (c ? ' err' : ''); hint.textContent = c || EX_HINT; }
      if (btn) btn.disabled = !S.ex.newPath.trim() || !!c;
    });
    // 한국어 IME 조합 중 Enter는 조합 확정이므로 추가하지 않는다.
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) { e.preventDefault(); add(); } });
    const shown = locked ? ex.environmentPaths : cur;
    const list = shown.length ? h('ul', { class: 'paths', 'aria-label': '예외 경로' }, ...shown.map((p, i) => h('li', null, h('code', null, p),
      !locked && !ex.signedPaths.includes(p) ? h('span', { class: 'tag new' }, '저장 전') : null,
      locked ? null : h('button', { type: 'button', class: 'btn sm danger', id: 'ex-del-' + i, disabled: !!S.busy, 'aria-label': p + ' 빼기', onclick: () => {
        cur.splice(i, 1); S.ex.cur = cur; delete S.status.exempt; render(); const f = $('ex-del-' + Math.min(i, cur.length - 1)) || $('ex-new'); if (f) f.focus();
      } }, '빼기'))))
      : h('p', { class: 'muted' }, '지정한 예외 경로가 없습니다.');
    const removed = ex.signedPaths.filter((p) => !cur.includes(p));
    return h('div', { class: 'box' }, h('h2', null, '편집 관문 예외 경로'),
      h('p', { class: 'desc' }, '버전 관리 안에 있지만 제품이 아닌 폴더를 넣으면, 그 안의 편집은 workflow 없이 허용됩니다. OS 임시 폴더와 호스트 메모 폴더는 이미 빠져 있습니다.'),
      locked ? lockLine(ex.lockedBy, '이 환경 변수의 목록을 씁니다. 서명한 목록(' + ex.signedPaths.length + '개)은 환경 변수가 없을 때 씁니다.', 'ex-lock') : null,
      list,
      locked ? null : h('div', { class: 'row' },
        h('div', { class: 'field' }, h('label', { for: 'ex-new', class: 'small muted' }, '추가할 절대 경로'), inp,
          h('span', { id: 'ex-hint', class: 'hint' + (addErr ? ' err' : '') }, addErr || EX_HINT)),
        h('button', { type: 'button', class: 'btn pri-o al', id: 'ex-add', disabled: !raw || !!addErr, onclick: add }, '경로 추가')),
      locked ? null : h('div', { class: 'row center' },
        signBtn({ id: 'ex-save', slot: 'exempt', label: '패스키로 저장', off: !dirty, onclick: () => runSigned({ slot: 'exempt', change: { op: 'editExempt.set', paths: cur.slice() },
          onStale: () => loadState(),
          onDone: (rec, loaded) => { if (loaded) { S.ex.cur = null; syncSettings(S.data); } S.status.exempt = { kind: 'ok', text: '예외 경로를 저장했습니다 · ' + fmtHM(rec.createdAt) + ' · 다음 편집부터 적용됩니다.' }; } }) }),
        dirty ? h('button', { type: 'button', class: 'btn', id: 'ex-undo', disabled: !!S.busy, onclick: () => { S.ex.cur = S.ex.base.slice(); render(); } }, '변경 취소') : null,
        dirty ? h('span', { class: 'small muted' }, '추가 ' + cur.filter((p) => !ex.signedPaths.includes(p)).length + ' · 빼기 ' + removed.length) : null),
      statusEl('exempt'));
  }

  // ---------- 패스키 ----------
  async function registerKey() {
    if (S.busy) return;
    const d = S.data, first = !d.keys.length;
    const label = (S.newKeyLabel.trim() || '패스키 ' + (d.keys.length + 1)).slice(0, 60);
    if (!window.PublicKeyCredential || !navigator.credentials) { setStatus('key-add', { kind: 'error', text: MSG.WEBAUTHN_UNSUPPORTED, code: 'WEBAUTHN_UNSUPPORTED' }); return; }
    S.busy = 'key-add'; setStatus('key-add', { kind: 'busy', text: '패스키 창에서 새 패스키를 만들어 주세요…' });
    let cred;
    try {
      cred = await navigator.credentials.create({ publicKey: {
        rp: { id: d.rpId, name: 'AGS 관리자' },
        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'ags-admin', displayName: 'AGS 관리자' },
        challenge: crypto.getRandomValues(new Uint8Array(32)),
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -8 }, { type: 'public-key', alg: -257 }],
        authenticatorSelection: { userVerification: 'required', residentKey: 'preferred' }, attestation: 'none', timeout: 120000 } });
    } catch (e) { S.busy = null; webauthnFail('key-add', e, '패스키 만들기를 취소했습니다(또는 시간이 지났습니다).'); return; }
    S.busy = null;
    if (!cred) { webauthnFail('key-add', { name: 'NotAllowedError' }, '패스키 만들기를 취소했습니다.'); return; }
    const pk = typeof cred.response.getPublicKey === 'function' ? cred.response.getPublicKey() : null;
    if (!pk) { setStatus('key-add', { kind: 'error', text: MSG.WEBAUTHN_PUBLIC_KEY_UNAVAILABLE, code: 'WEBAUTHN_PUBLIC_KEY_UNAVAILABLE' }); return; }
    const id = b64u.enc(cred.rawId);
    await runSigned({ slot: 'key-add', bootstrap: first, allow: first ? [id] : null,
      change: { op: 'key.add', credentialId: id, publicKey: b64u.enc(pk), alg: cred.response.getPublicKeyAlgorithm(), label },
      cancelText: '패스키 확인을 취소해 등록하지 않았습니다. 인증기에 새로 만든 패스키는 쓰이지 않습니다(인증기에서 지워도 됩니다).',
      onStale: () => loadState(),
      onDone: () => { remember(id); S.newKeyLabel = ''; if (first) S.firstKeyNotice = true; S.status['key-add'] = { kind: 'ok', text: '패스키 「' + label + '」를 등록했습니다 · ' + fmtHM() }; } });
  }
  function openRevoke(k, opener) {
    delete S.status['key-del'];
    openDialog({ opener, cls: 'narrow', focus: 'key-del-cancel', fallbackFocus: 'p-title', build: (dlg) => [
      h('h2', { id: 'dlg-title' }, '패스키 「' + k.label + '」를 삭제할까요?'),
      h('p', null, '지문 ', h('code', null, k.fingerprint), ' · ' + fmtTime(k.addedAt) + ' 등록. 삭제하면 이 패스키로는 더 저장할 수 없고, 이 패스키로 서명한 기록도 효력을 잃을 수 있습니다. 남은 패스키로 확인합니다.'),
      statusEl('key-del'),
      h('div', { class: 'dlg-acts' }, h('button', { type: 'button', class: 'btn', id: 'key-del-cancel', onclick: () => dlg.close() }, '취소'),
        signBtn({ id: 'key-del-go', slot: 'key-del', cls: 'btn danger', label: '패스키로 삭제', off: S.data.keys.length <= 1, onclick: () => runSigned({
          slot: 'key-del', change: { op: 'key.revoke', credentialId: k.credentialId }, onStale: () => loadState(),
          onDone: () => { forget(k.credentialId); S.status['key-screen'] = { kind: 'ok', text: '패스키 「' + k.label + '」를 삭제했습니다 · ' + fmtHM() }; dlg.close(); } }) }))] });
  }
  function viewPasskey() {
    const d = S.data, keys = d.keys, mine = lsRead();
    const sec = h('section', { class: 'col', 'aria-labelledby': 'p-title' },
      head('p-title', '패스키', '설정을 저장할 때 이 패스키로 본인을 확인합니다. 추가·삭제도 기존 패스키 확인이 필요합니다. 처음 하나만 확인 없이 등록됩니다.'));
    if (S.firstKeyNotice) sec.append(h('div', { class: 'note-ok', role: 'status' }, '처음 등록한 패스키입니다. 목록의 등록 시각·지문이 내 것인지 확인하세요.'));
    if (d.bootstrap) {
      const still = keys.some((k) => k.credentialId === d.bootstrap.credentialId);
      sec.append(h('div', { class: 'box' }, h('h2', null, '최초 등록 패스키'),
        h('span', null, fmtTime(d.bootstrap.at) + ' · 지문 ', h('code', null, d.bootstrap.fingerprint), still ? '' : ' · 지금 목록에는 없음(삭제됨)'),
        h('span', { class: 'small muted' }, '처음 등록은 확인 없이 받습니다. 내가 등록한 시각·지문이 아니면 이 PC의 다른 프로그램이 먼저 등록했을 수 있습니다.')));
    }
    sec.append(statusEl('key-screen'));
    if (!S.dialog && S.status['key-del'] && S.status['key-del'].kind !== 'busy') sec.append(statusEl('key-del'));
    const tbody = h('tbody');
    if (!keys.length) tbody.append(h('tr', null, h('td', { colspan: '5', class: 'muted' }, '등록된 패스키가 없습니다.')));
    for (const k of keys) {
      const last = keys.length <= 1;
      tbody.append(h('tr', null,
        h('td', null, h('b', null, k.label), mine && mine.includes(k.credentialId) ? h('span', { class: 'tag' }, '이 브라우저') : null,
          d.bootstrap && d.bootstrap.credentialId === k.credentialId ? h('span', { class: 'tag' }, '최초') : null),
        h('td', null, h('code', null, k.fingerprint)),
        h('td', { class: 'nowrap' }, fmtTime(k.addedAt)),
        h('td', { class: 'nowrap' }, k.lastUsedAt ? fmtTime(k.lastUsedAt) : '—'),
        h('td', null, h('div', { class: 'acts' },
          h('button', { type: 'button', class: 'btn sm danger', id: 'key-del-' + idSafe(k.credentialId), disabled: last || !!S.busy, 'aria-describedby': last ? 'key-last-why' : null, onclick: (e) => openRevoke(k, e.currentTarget) }, '삭제'),
          last ? h('span', { id: 'key-last-why', class: 'small muted' }, '마지막 패스키는 지울 수 없습니다. 다른 패스키를 먼저 추가하세요.') : null))));
    }
    sec.append(h('div', { class: 'tbl-wrap' }, h('table', null, h('caption', null, '등록된 패스키'),
      h('thead', null, h('tr', null, ['이름', '지문', '등록', '마지막 사용', '동작'].map((t) => h('th', { scope: 'col' }, t)))), tbody)));
    if (mine === null) sec.append(h('p', { class: 'small muted' }, '이 브라우저 저장소를 쓸 수 없어 「이 브라우저」 표시를 하지 못합니다.'));
    const first = !keys.length;
    const lab = h('input', { id: 'new-key-label', type: 'text', class: 'txt-in', maxlength: '60', autocomplete: 'off', value: S.newKeyLabel, placeholder: '예: Windows Hello', 'aria-describedby': 'new-key-hint' });
    lab.addEventListener('input', () => { S.newKeyLabel = lab.value; });
    const addBtn = h('button', { type: 'button', class: 'btn pri al', id: 'key-add', disabled: !!S.busy || slotBlocked('key-add'), onclick: registerKey },
      S.busy === 'key-add' ? '저장 중…' : first ? '첫 패스키 등록' : '패스키 추가(기존 패스키 확인)');
    sec.append(h('div', { class: 'box' }, h('h2', null, first ? '첫 패스키 등록' : '패스키 추가'),
      h('div', { class: 'row' }, h('div', { class: 'field' }, h('label', { for: 'new-key-label', class: 'small muted' }, '패스키 이름 (60자 이내, 비우면 「패스키 ' + (keys.length + 1) + '」)'), lab,
        h('span', { id: 'new-key-hint', class: 'hint' }, first ? '처음 하나는 확인 없이 등록됩니다. 등록 뒤 목록의 시각·지문이 내 것인지 확인하세요.' : '새 패스키를 만든 뒤, 이미 등록된 패스키로 한 번 더 확인합니다.')),
        addBtn),
      statusEl('key-add')));
    return sec;
  }

  // ---------- 시작 ----------
  function hasUnsaved() {
    if (!S.data) return false;
    if (isGlobalDirty()) return true;
    if (S.r.newName.trim()) return true;
    const ren = S.r.renaming; if (ren) { const r = roleById(ren.roleId); if (r && ren.value.normalize('NFC').trim() !== r.name) return true; }
    if (isJevDirty() || isExemptDirty() || S.ex.newPath.trim()) return true;
    return false;
  }
  window.addEventListener('beforeunload', (e) => { if (hasUnsaved()) { e.preventDefault(); e.returnValue = ''; } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && !S.busy && S.data) loadState(); });
  render();
  loadState();
})();
</script>
</body>
</html>
