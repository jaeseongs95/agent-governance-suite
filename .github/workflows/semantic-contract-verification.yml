name: Semantic contract verification

on:
  push:
    branches:
      - codex/v260-semantic-decision-layer

permissions:
  contents: read

jobs:
  verify:
    if: github.event.head_commit.message == '[verify-semantic-contracts]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frozen dependencies and check the untouched bundle first
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          mkdir -p "$RUNNER_TEMP/semantic-evidence"
          pnpm bundle:check > "$RUNNER_TEMP/semantic-evidence/bundle-initial.log" 2>&1
          git rev-parse HEAD > "$RUNNER_TEMP/semantic-evidence/trigger-commit.txt"
          git rev-parse 'HEAD^{tree}' > "$RUNNER_TEMP/semantic-evidence/trigger-tree.txt"
          git status --porcelain=v1 > "$RUNNER_TEMP/semantic-evidence/status-initial.txt"
          node --version > "$RUNNER_TEMP/semantic-evidence/node.txt"
          pnpm --version > "$RUNNER_TEMP/semantic-evidence/pnpm.txt"
          uname -a > "$RUNNER_TEMP/semantic-evidence/os.txt"
      - name: Verify in order and retain every exit code
        shell: bash
        run: |
          set +e
          out="$RUNNER_TEMP/semantic-evidence"
          git write-tree > "$out/verification-tree.txt"
          run_check() {
            name="$1"; shift
            timeout 360 "$@" > "$out/$name.log" 2>&1
            code=$?
            printf '%s\t%s\n' "$name" "$code" | tee -a "$out/results.tsv"
          }
          run_check bundle-before pnpm bundle:check
          run_check claude-drift pnpm claude:drift
          run_check lint pnpm lint
          run_check build pnpm build
          run_check contracts pnpm exec vitest run tests/coordinate-subagents/semantic-decision tests/coordinate-subagents/model-routing-v2/contracts.test.mjs
          run_check focused pnpm exec vitest run tests/coordinate-subagents/model-routing-v2 tests/coordinate-subagents/semantic-decision tests/mcp/model-routing-service.test.ts tests/mcp/model-routing-workflow.test.mjs tests/mcp/model-routing-host-hook.test.mjs tests/mcp/session-model-capabilities.test.mjs tests/mcp/model-peer-handoff.test.mjs tests/mcp/model-peer-preflight.test.mjs tests/mcp/model-peer-start.test.mjs tests/runtime/runtime-smoke.test.mjs
          run_check full pnpm test
          run_check runtime pnpm runtime:check
          run_check validate-all pnpm validate:all
          run_check validate-official pnpm validate:official
          run_check source pnpm source:check
          run_check bundle-after pnpm bundle:check
          run_check diff-check bash -c 'git diff --check && git diff --cached --check'
          git status --porcelain=v1 > "$out/status-after.txt"
          git diff --binary > "$out/unstaged.patch"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semantic-contract-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/semantic-evidence/
          retention-days: 14
      - name: Report all nonzero checks, including unavailable official validation
        if: always()
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/semantic-evidence/results.tsv"
          awk -F '\t' '$2 != 0 {failed=1} END {exit failed}' "$RUNNER_TEMP/semantic-evidence/results.tsv"
