name: Prepare peer start claim workspace

on:
  push:
    branches: [codex/v250-model-routing-integration]

permissions:
  contents: read

jobs:
  prepare:
    if: contains(github.event.head_commit.message, '[p54b-workspace]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07e8794f3ff7d24cf21d2754e24009bf30ed9b5b
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Verify baseline and export development workspace without credentials
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = 548b66e34669f9223b36e448141059d4d88f8e50
          corepack enable
          pnpm install --frozen-lockfile
          pnpm bundle:check
          mkdir -p "$RUNNER_TEMP/peer-start-workspace"
          git archive HEAD | gzip -n > "$RUNNER_TEMP/peer-start-workspace/source.tar.gz"
          tar -czf "$RUNNER_TEMP/peer-start-workspace/dependencies.tar.gz" node_modules
          corepack pack -o "$RUNNER_TEMP/peer-start-workspace/pnpm-cache.tgz"
          git ls-tree -r HEAD > "$RUNNER_TEMP/peer-start-workspace/base-tree.txt"
          printf '%s\n' '07e8794f3ff7d24cf21d2754e24009bf30ed9b5b' '548b66e34669f9223b36e448141059d4d88f8e50' > "$RUNNER_TEMP/peer-start-workspace/baseline.txt"
          cd "$RUNNER_TEMP/peer-start-workspace"
          sha256sum source.tar.gz dependencies.tar.gz pnpm-cache.tgz base-tree.txt baseline.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: peer-start-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/peer-start-workspace/
          compression-level: 0
          retention-days: 3
          if-no-files-found: error
