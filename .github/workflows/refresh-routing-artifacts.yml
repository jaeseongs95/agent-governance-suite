name: Apply checked capability exchange

on:
  push:
    branches:
      - codex/v250-model-routing-integration

permissions:
  contents: read

jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-capability-exchange]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BASE_SHA: cef975cbf32fc72496daee037b10a424ccaad4b6
      EXPECTED_TREE: 44774e7703174f8f6b2870544263947394b111f3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check baseline and install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm bundle:check
      - name: Verify exact source patch and remove temporary delivery files
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          import path from 'node:path';
          // Restore three base64 symbols lost during text transfer before validating the complete payload.
          const transferred = readFileSync('.ags-delivery/patch-01.brpart');
          const restored = (transferred.toString('base64') + 'd').replace('JHmYDdH4XwMbs', 'JHmYDdHk9H4XwMbs');
          const first = Buffer.from(restored, 'base64');
          const gitHash = createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${first.length}\0`), first])).digest('hex');
          if (gitHash !== '4e46b887186e38a28c2b3ccdfcd416f25d641afd') throw new Error('First transfer part differs');
          const packed = Buffer.concat([first, readFileSync('.ags-delivery/patch-02.brpart'), readFileSync('.ags-delivery/patch-03.brpart')]);
          const patch = brotliDecompressSync(packed, { maxOutputLength: 1024 * 1024 });
          if (createHash('sha256').update(patch).digest('hex') !== 'd5302cf5d72e8a09125a7b89754027edc4de0b0291ff8cba84a28c551e5c73d7') {
            throw new Error('Source patch differs from the locally tested patch');
          }
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'ags-capability-source.patch'), patch);
          NODE
          git restore --source="$BASE_SHA" --staged --worktree -- .github/workflows/refresh-routing-artifacts.yml
          git rm -- .ags-delivery/patch-01.brpart .ags-delivery/patch-02.brpart .ags-delivery/patch-03.brpart
          git apply --index --whitespace=error-all "$RUNNER_TEMP/ags-capability-source.patch"
      - name: Build and verify the entire source and generated tree
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          pnpm claude:build
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          pnpm bundle:check
          pnpm claude:check
          pnpm source:check
          pnpm lint
      - name: Verify capability exchange and unchanged routing boundaries
        shell: bash
        run: |
          pnpm exec vitest run tests/coordinate-subagents/model-routing-v2 tests/mcp/model-routing-service.test.ts tests/mcp/model-routing-workflow.test.mjs tests/mcp/model-routing-host-hook.test.mjs tests/mcp/model-routing-host-install.test.mjs tests/mcp/session-model-capabilities.test.mjs tests/mcp/model-capability-exchange-install.test.mjs tests/mcp/host-attestation.test.ts tests/mcp/host-attestation-hook.test.ts tests/tooling/claude-plugin.test.mjs tests/runtime/runtime-smoke.test.mjs
      - name: Run full regression separately from the functional increment
        continue-on-error: true
        shell: bash
        run: pnpm test
      - name: Fast-forward only the requested branch with the exact tested tree
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target=refs/heads/codex/v250-model-routing-integration
          remote_sha=$(git ls-remote origin "$target" | cut -f1)
          test "$remote_sha" = "$SOURCE_SHA"
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: share model capabilities through the session broker' -m 'Add signed, bounded capability publication and revision/presence-bound paging to the existing TLS broker. Feed complete per-request capability sets into the existing resolver without importing another host database, changing v1 gates, or executing peer assignments. Preserve old-broker messaging and additive DB rollback compatibility. Remove the one-use delivery payload and restore the prior artifact workflow. The full file tree is identical to the locally tested candidate.'
          git push origin "HEAD:$target"
