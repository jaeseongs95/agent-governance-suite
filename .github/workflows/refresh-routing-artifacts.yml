name: Refresh checked routing artifacts

on:
  push:
    branches:
      - codex/v250-model-routing-integration

permissions:
  contents: read

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-routing-artifacts]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild from frozen dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          # The generator enumerates tracked shared files; include the new generated entrypoint.
          git add --intent-to-add -- mcp-server/dist/model-routing-host-hook.mjs
          pnpm claude:build
      - name: Verify and stage only the locally checked generated files
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const expected = JSON.parse(readFileSync('docs/model-routing-p3-artifacts.json', 'utf8'));
          const paths = Object.keys(expected.sha256);
          if (!paths.length || paths.length > 32) throw new Error('Invalid generated file set');
          for (const path of paths) {
            if (path.includes('..') || !/^(?:mcp-server\/dist\/[a-z-]+\.mjs|claude-plugin\/[A-Za-z0-9_./-]+)$/u.test(path)) {
              throw new Error(`Not an allowed generated path: ${path}`);
            }
            const actual = createHash('sha256').update(readFileSync(path)).digest('hex');
            if (expected.sha256[path] !== actual) throw new Error(`Generated bytes differ from locally tested bytes: ${path}`);
          }
          const changed = [
            ...execFileSync('git', ['diff', '--name-only', '-z', 'HEAD'], { encoding: 'utf8' }).split('\0'),
            ...execFileSync('git', ['ls-files', '--others', '--exclude-standard', '-z'], { encoding: 'utf8' }).split('\0'),
          ].filter(Boolean);
          if (changed.some(path => !paths.includes(path))) throw new Error('Rebuild changed files outside the checked generated set');
          execFileSync('git', ['add', '--', ...paths]);
          NODE
          pnpm bundle:check
          pnpm claude:check
          pnpm source:check
          pnpm exec vitest run tests/mcp/model-routing-host-hook.test.mjs tests/mcp/model-routing-host-install.test.mjs tests/mcp/model-routing-workflow.test.mjs tests/mcp/model-routing-service.test.ts tests/mcp/host-attestation.test.ts tests/mcp/host-attestation-hook.test.ts tests/coordinate-subagents/model-routing-v2 tests/runtime/runtime-smoke.test.mjs tests/tooling/claude-plugin.test.mjs
      - name: Fast-forward the requested branch with generated files only
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target=refs/heads/codex/v250-model-routing-integration
          remote_sha=$(git ls-remote origin "$target" | cut -f1)
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo 'Branch moved; refusing to overwrite newer work.' >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'Generated artifacts already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh checked native routing observation artifacts'
          git push origin "HEAD:$target"
