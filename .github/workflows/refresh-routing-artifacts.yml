name: Verify checked peer handoff increment

on:
  push:
    branches:
      - codex/v250-model-routing-integration

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-peer-handoff]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BASE_SHA: 56f3650fd89e7891e73aff51f421950a52c78d37
      EXPECTED_TREE: 5f55b939d8739233ac7820cff889416d780cf27a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline and frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm bundle:check
      - name: Verify and apply the exact source patch
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          import path from 'node:path';
          const hashes = ['2bb3016665906ff025da8ba74b1879fa0e7d5b1a','edd9135d22b63ec20610794118c06b53261dcbcf','2d49e6aff49b413265de6d980875f9d3f6188c88','d32530276dee432c1646d255bbbb99f981369cd0'];
          const parts = hashes.map((expected, index) => {
            const bytes = readFileSync(`.ags-delivery/peer-${String(index + 1).padStart(2, '0')}.brpart`);
            const actual = createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${bytes.length}\0`),bytes])).digest('hex');
            if (actual !== expected) throw new Error('Transfer part differs');
            return bytes;
          });
          const patch = brotliDecompressSync(Buffer.concat(parts), { maxOutputLength: 2 * 1024 * 1024 });
          if (createHash('sha256').update(patch).digest('hex') !== 'd0bdbfe8b0f645ba589304fa62e7cc0d0292490b3da13e0b03007bfce8dc5966') throw new Error('Source patch differs');
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'peer-source.patch'), patch);
          NODE
          git restore --source="$BASE_SHA" --staged --worktree -- .github/workflows/refresh-routing-artifacts.yml
          git rm -- .ags-delivery/peer-01.brpart .ags-delivery/peer-02.brpart .ags-delivery/peer-03.brpart .ags-delivery/peer-04.brpart
          git apply --index --whitespace=error-all "$RUNNER_TEMP/peer-source.patch"
      - name: Rebuild and verify the complete candidate tree
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          git add --intent-to-add -- mcp-server/dist/model-routing-peer-cli.mjs
          pnpm claude:build
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          pnpm bundle:check
          pnpm claude:check
          pnpm source:check
          pnpm lint
      - name: Verify handoff and unchanged routing boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec vitest run tests/coordinate-subagents/model-routing-v2 tests/mcp/model-routing-service.test.ts tests/mcp/model-routing-workflow.test.mjs tests/mcp/model-routing-host-hook.test.mjs tests/mcp/model-routing-host-install.test.mjs tests/mcp/session-model-capabilities.test.mjs tests/mcp/model-capability-exchange-install.test.mjs tests/mcp/model-peer-handoff.test.mjs tests/mcp/model-peer-install.test.mjs tests/mcp/host-attestation.test.ts tests/mcp/host-attestation-hook.test.ts tests/tooling/claude-plugin.test.mjs tests/runtime/runtime-smoke.test.mjs | tee "$RUNNER_TEMP/peer-focused.log"
      - name: Run full regression separately from the functional increment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          pnpm test | tee "$RUNNER_TEMP/peer-full.log"
      - name: Publish verified Git objects without changing any branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const repo = process.env.GITHUB_REPOSITORY;
          if (repo !== 'jaeseongs95/agent-governance-suite') throw new Error('Unexpected repository');
          const baseTree = git('rev-parse','HEAD^{tree}');
          const expected = process.env.EXPECTED_TREE;
          async function post(endpoint, value) {
            const response = await fetch(`https://api.github.com/repos/${repo}/git/${endpoint}`, {
              method: 'POST', signal: AbortSignal.timeout(45000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28' },
              body: JSON.stringify(value),
            });
            if (!response.ok) throw new Error(`Git object publication failed: ${endpoint} HTTP ${response.status}`);
            return response.json();
          }
          const raw = execFileSync('git',['diff','--cached','--name-status','--no-renames','-z','HEAD'],{encoding:'utf8'}).split('\0').filter(Boolean);
          if (raw.length % 2 || raw.length > 160) throw new Error('Invalid changed file set');
          const entries = [];
          for (let i = 0; i < raw.length; i += 2) {
            const status = raw[i], file = raw[i + 1];
            if (file.startsWith('/') || file.split('/').includes('..')) throw new Error('Invalid path');
            if (status === 'D') { entries.push({ path:file,mode:'100644',type:'blob',sha:null }); continue; }
            if (!['A','M'].includes(status)) throw new Error('Unexpected change kind');
            const bytes = readFileSync(file);
            const expectedBlob = createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${bytes.length}\0`),bytes])).digest('hex');
            if (git('rev-parse',`:${file}`) !== expectedBlob) throw new Error('Unstaged changed bytes');
            const mode = git('ls-files','--stage','--',file).split(' ')[0];
            if (!['100644','100755'].includes(mode)) throw new Error('Unexpected file mode');
            const blob = await post('blobs',{ content:bytes.toString('base64'),encoding:'base64' });
            if (blob.sha !== expectedBlob) throw new Error('Published blob differs');
            entries.push({ path:file,mode,type:'blob',sha:blob.sha });
          }
          const tree = await post('trees',{base_tree:baseTree,tree:entries});
          if (tree.sha !== expected) throw new Error('Published tree differs from tested candidate');
          writeFileSync(path.join(process.env.RUNNER_TEMP,'peer-published-tree.json'),JSON.stringify({tree:tree.sha,deliveryCommit:process.env.GITHUB_SHA,branchUpdated:false},null,2)+'\n');
          console.log(`PUBLISHED_TREE=${tree.sha}; no ref was changed`);
          NODE
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-handoff-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/peer-focused.log
            ${{ runner.temp }}/peer-full.log
            ${{ runner.temp }}/peer-published-tree.json
          if-no-files-found: warn
          retention-days: 14
