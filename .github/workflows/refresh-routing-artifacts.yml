name: Refresh checked routing artifacts

on:
  push:
    branches:
      - codex/v250-model-routing-integration

permissions:
  contents: read

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[refresh-routing-artifacts]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild from frozen dependencies
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build
          pnpm claude:build
      - name: Verify only the two locally checked generated files changed
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const expected = JSON.parse(readFileSync('docs/model-routing-p5-artifacts.json', 'utf8'));
          const paths = ['mcp-server/dist/server.mjs', 'claude-plugin/mcp-server/dist/server.mjs'];
          for (const path of paths) {
            const actual = createHash('sha256').update(readFileSync(path)).digest('hex');
            if (expected.sha256[path] !== actual) throw new Error(`Generated bytes differ from locally tested bytes: ${path}`);
          }
          NODE
          git diff --exit-code -- . ':!mcp-server/dist/server.mjs' ':!claude-plugin/mcp-server/dist/server.mjs'
          pnpm bundle:check
          pnpm claude:check
          pnpm source:check
          pnpm exec vitest run tests/mcp/model-routing-workflow.test.mjs tests/mcp/model-routing-service.test.ts tests/coordinate-subagents/model-routing-v2
      - name: Fast-forward the requested branch with generated files only
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target=refs/heads/codex/v250-model-routing-integration
          remote_sha=$(git ls-remote origin "$target" | cut -f1)
          if [ "$remote_sha" != "$SOURCE_SHA" ]; then
            echo 'Branch moved; refusing to overwrite newer work.' >&2
            exit 1
          fi
          if git diff --quiet -- mcp-server/dist/server.mjs claude-plugin/mcp-server/dist/server.mjs; then
            echo 'Generated artifacts already match.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- mcp-server/dist/server.mjs claude-plugin/mcp-server/dist/server.mjs
          git commit -m 'build: refresh checked model routing workflow artifacts'
          git push origin "HEAD:$target"
