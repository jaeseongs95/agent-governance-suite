name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-release:
    name: Final D0352 Windows native boundary
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Observe frozen Windows source and first native boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          [Console]::OutputEncoding=$OutputEncoding=[Text.UTF8Encoding]::new($false)
          $root=Join-Path $env:GITHUB_WORKSPACE '.github/ci/d0352-final-windows-r01'
          $out=Join-Path $env:RUNNER_TEMP ('d0352-final-windows-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT)
          if(Test-Path -LiteralPath $out){throw 'NEW_OUTPUT_REQUIRED'}
          [IO.Directory]::CreateDirectory($out)|Out-Null
          $result=[ordered]@{scope='구문과 실제 native API 첫 경계만';f1='NOT_RESOLVED';helperMain=0;actualApplicationExit=0;actualInstallation=0;actual16Backup=0;hiddenChildLaunch=0;cases=@();native=$null;boundary=$null;error=$null}
          $code=1
          try {
            $pins=@{
              'FINAL-BINDING.safe.json'='4ab1d20e6ba456f2808bb0822936ffda7c97cfd3b993015b5927cb14a52b4cd7'
              'Invoke-R11Once.ps1'='1d4b0acc6153e165f72a67275ca00873adc873c4911c6bb593d3b902b4e18f2c'
              'Headless-Guard.ps1'='c7dd13e400024e0cd641c8c83be07183ea4849945bbff50d2fe921379f2f07b0'
              'Start-Headless.ps1'='08a4b205e4b0f117cc6e7a0bf62cad0a468d0af3f9092838d639c3123b46e75a'
              'Launch-Headless.vbs'='99f3476f318b947900a86ff4da1a9402e2d0cbcb12de03cbf91641e4fb176222'
            }
            foreach($name in $pins.Keys){
              $path=Join-Path $root $name
              $hash=(Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              if($hash -cne $pins[$name]){throw ('FROZEN_BYTES_MISMATCH: '+$name)}
              if($name.EndsWith('.ps1')){
                $tokens=$null;$errors=$null
                $null=[Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
                $result.cases+=@{name=$name;sha256=$hash;parseErrors=@($errors|ForEach-Object {$_.Message})}
                if($errors.Count){throw ('PARSE_FAILED: '+$name)}
              }else{$result.cases+=@{name=$name;sha256=$hash;execution='NOT_RUN'}}
            }
            # 최종 원도우미는 dot-source 모드에서 main을 호출하지 않는다. 고정 guard와 원함수만 로드한다.
            . (Join-Path $root 'Invoke-R11Once.ps1')
            $before=[R07HeadlessNative]::Observe([uint32]$PID)
            Start-Sleep -Milliseconds 2000
            $after=[R07HeadlessNative]::Identity([uint32]$PID)
            $result.native=@{before=$before;after=$after;samePidAndCreation=($before.self.pid -eq $after.pid -and $before.self.creationFileTime -eq $after.creationFileTime);meaning='CI 조회 프로세스의 동일 세대 관측이며 실앱 종료 뒤 도우미 생존 증거가 아니다'}
            try {
              $observation=Get-R07HeadlessObservation 'Helper' $script:ExecutorPowerShell (Join-Path $root 'Launch-Headless.vbs') $pins['Launch-Headless.vbs'] (Join-Path $root 'Start-Headless.ps1')
              $result.boundary=@{state='RETURNED';observation=$observation;productionActivation='NOT_CLAIMED'}
            }catch{$result.boundary=@{state='REJECTED';type=$_.Exception.GetType().FullName;message=$_.Exception.Message;nativeObservation=$script:R07LastNativeObservation}}
            $code=0
          }catch{$result.error=@{type=$_.Exception.GetType().FullName;message=$_.Exception.Message}}
          finally{
            $result.exitCode=$code
            $result.runtime=@{commit=$env:GITHUB_SHA;runId=$env:GITHUB_RUN_ID;attempt=$env:GITHUB_RUN_ATTEMPT;path=[Environment]::ProcessPath;version=$PSVersionTable.PSVersion.ToString();os=[Environment]::OSVersion.ToString();sha256=(Get-FileHash -LiteralPath ([Environment]::ProcessPath) -Algorithm SHA256).Hash.ToLowerInvariant()}
            [IO.File]::WriteAllText((Join-Path $out 'RESULT.safe.json'),($result|ConvertTo-Json -Depth 30).Replace([string][char]13,'')+[char]10,[Text.UTF8Encoding]::new($false))
            $result|ConvertTo-Json -Depth 30
          }
          exit $code
      - name: Return D0352 native boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d0352-final-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d0352-final-windows-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 1
