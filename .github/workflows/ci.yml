name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - "22"
          - "24"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Enable Corepack
        shell: bash
        run: corepack enable
      - name: Install locked dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Verify committed runtime bundles
        shell: bash
        run: pnpm bundle:check
      - name: Lint
        shell: bash
        run: pnpm lint
      - name: Build
        shell: bash
        run: pnpm build
      - name: Test
        shell: bash
        run: pnpm test
      - name: Verify installed runtime
        shell: bash
        run: pnpm runtime:check
      - name: Validate plugin and skills
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: pnpm validate:all
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        shell: bash
        run: git show --check --oneline --no-renames HEAD
