name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "생성할 공식 저장소 커밋 SHA (생략 시 워크플로 이벤트 SHA)"
        required: false
        type: string
  push:
    branches:
      - main
      - release-3.0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/release-3.0' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/release-3.0' }}

jobs:
  generate-release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release-3.0'
    name: Generate release artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WORKFLOW_EXECUTION_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Initialize generation evidence
        shell: bash
        run: |
          log="$RUNNER_TEMP/d0352-generation-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          printf 'GENERATION_LOG_DIR=%s\n' "$log" >> "$GITHUB_ENV"
          mkdir -p "$log"
      - name: Validate source commit selection
        id: source
        shell: bash
        env:
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
        run: |
          set +e
          (
            set -euo pipefail
            source_sha=${SOURCE_SHA_INPUT:-$GITHUB_SHA}
            if [[ ! "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
              printf 'source_sha must be exactly 40 hexadecimal characters\n' >&2
              exit 1
            fi
            source_sha=${source_sha,,}
            printf 'GENERATION_SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
            printf 'eventSha=%s\nworkflowSha=%s\nsourceSha=%s\nrepository=jaeseongs95/agent-governance-suite\n' "$GITHUB_SHA" "$WORKFLOW_EXECUTION_SHA" "$source_sha"
          ) > "$GENERATION_LOG_DIR/source-selection.stdout" 2> "$GENERATION_LOG_DIR/source-selection.stderr"
          code=$?
          printf '%s\n' "$code" > "$GENERATION_LOG_DIR/source-selection.exit-code.txt"
          cat "$GENERATION_LOG_DIR/source-selection.stdout"
          cat "$GENERATION_LOG_DIR/source-selection.stderr" >&2
          exit "$code"
      - name: Check out selected official source commit
        id: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: jaeseongs95/agent-governance-suite
          ref: ${{ env.GENERATION_SOURCE_SHA }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        id: node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Set up Python
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Run normal generation and freshness commands
        id: generate
        shell: bash
        run: |
          set -euo pipefail
          log="${GENERATION_LOG_DIR:?}"
          run_phase() {
            local phase=$1 code
            shift
            printf '%s\0' "$@" > "$log/$phase.argv.nul"
            printf 'RUNNING\n' > "$log/$phase.status.txt"
            set +e
            "$@" > "$log/$phase.stdout" 2> "$log/$phase.stderr"
            code=$?
            set -e
            printf '%s\n' "$code" > "$log/$phase.exit-code.txt"
            printf 'EXECUTED\n' > "$log/$phase.status.txt"
            cat "$log/$phase.stdout"
            cat "$log/$phase.stderr" >&2
            return "$code"
          }
          run_phase head-before git rev-parse HEAD 'HEAD^{tree}'
          run_phase workflow-identity git rev-parse "$WORKFLOW_EXECUTION_SHA" "${WORKFLOW_EXECUTION_SHA}^{tree}"
          run_phase source-object-type git cat-file -t "$GENERATION_SOURCE_SHA"
          test "$(cat "$log/source-object-type.stdout")" = commit
          test "$(head -n 1 "$log/head-before.stdout")" = "$GENERATION_SOURCE_SHA"
          run_phase status-before git status --porcelain=v1
          run_phase corepack corepack enable
          run_phase install pnpm install --frozen-lockfile
          run_phase build pnpm build
          run_phase claude-build pnpm claude:build
          run_phase bundle-check pnpm bundle:check
          run_phase claude-check pnpm claude:check
          run_phase context-check pnpm skills:context-check
      - name: Collect generation evidence on every outcome
        id: finalize
        if: ${{ always() }}
        shell: bash
        env:
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          NODE_OUTCOME: ${{ steps.node.outcome }}
          PYTHON_OUTCOME: ${{ steps.python.outcome }}
          GENERATION_OUTCOME: ${{ steps.generate.outcome }}
        run: |
          mkdir -p "$GENERATION_LOG_DIR"
          set +e
          python3 - <<'PY' > "$GENERATION_LOG_DIR/finalize.stdout" 2> "$GENERATION_LOG_DIR/finalize.stderr"
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          log = Path(os.environ["GENERATION_LOG_DIR"])
          problems = []

          def capture(name, arguments, accepted=(0,)):
              with (log / (name + ".stdout")).open("wb") as stdout, (log / (name + ".stderr")).open("wb") as stderr:
                  result = subprocess.run(arguments, stdout=stdout, stderr=stderr, check=False)
              (log / (name + ".exit-code.txt")).write_text(str(result.returncode) + "\n", encoding="utf-8")
              if result.returncode not in accepted:
                  problems.append({"phase": name, "exitCode": result.returncode})
              return (log / (name + ".stdout")).read_bytes()

          for phase in ("source-object-type", "head-before", "workflow-identity", "status-before", "corepack", "install", "build", "claude-build", "bundle-check", "claude-check", "context-check"):
              status = log / (phase + ".status.txt")
              if not status.exists():
                  status.write_text("NOT_RUN\n", encoding="utf-8")
          capture("head-after", ["git", "rev-parse", "HEAD", "HEAD^{tree}"])
          capture("status-after", ["git", "status", "--porcelain=v1"])
          tracked_patch = capture("tracked-patch", ["git", "diff", "--binary", "--full-index", "HEAD", "--"])
          inventory = capture("file-inventory", ["git", "ls-files", "-z", "--cached", "--others", "--exclude-standard"])
          untracked = capture("untracked-inventory", ["git", "ls-files", "-z", "--others", "--exclude-standard"])
          with (log / "generation.patch").open("wb") as patch:
              patch.write(tracked_patch)
              for index, raw in enumerate(filter(None, untracked.split(b"\0"))):
                  patch.write(capture("untracked-patch-" + str(index), ["git", "diff", "--no-index", "--binary", "--full-index", "--", "/dev/null", os.fsdecode(raw)], accepted=(1,)))
          files = []
          for raw in sorted(set(filter(None, inventory.split(b"\0")))):
              name = os.fsdecode(raw)
              file = Path(name)
              if not file.is_file():
                  files.append({"path": name, "sha256": None})
                  continue
              digest = hashlib.sha256()
              with file.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              files.append({"path": name, "bytes": file.stat().st_size, "sha256": digest.hexdigest()})
          (log / "repository-files.sha256.json").write_text(json.dumps(files, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          workflow_identity = (log / "workflow-identity.stdout").read_text(encoding="utf-8").splitlines() if (log / "workflow-identity.stdout").exists() else []
          source_identity = (log / "head-before.stdout").read_text(encoding="utf-8").splitlines() if (log / "head-before.stdout").exists() else []
          summary = {
              "eventSha": os.environ["GITHUB_SHA"], "ref": os.environ["GITHUB_REF"],
              "workflowSha": os.environ["WORKFLOW_EXECUTION_SHA"], "workflowTree": workflow_identity[1] if len(workflow_identity) == 2 else None,
              "sourceSha": os.environ.get("GENERATION_SOURCE_SHA"), "sourceHead": source_identity[0] if source_identity else None,
              "sourceTree": source_identity[1] if len(source_identity) == 2 else None,
              "runId": os.environ["GITHUB_RUN_ID"], "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "outcomes": {name: os.environ.get(name, "") for name in ("SOURCE_OUTCOME", "CHECKOUT_OUTCOME", "NODE_OUTCOME", "PYTHON_OUTCOME", "GENERATION_OUTCOME")},
              "collectionErrors": problems,
          }
          (log / "summary.json").write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          raise SystemExit(1 if problems else 0)
          PY
          code=$?
          printf '%s\n' "$code" > "$GENERATION_LOG_DIR/finalize.exit-code.txt"
          cat "$GENERATION_LOG_DIR/finalize.stdout"
          cat "$GENERATION_LOG_DIR/finalize.stderr" >&2
          exit "$code"
      - name: Upload generation evidence on every outcome
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d0352-generation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.GENERATION_LOG_DIR }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  verify:
    if: github.ref != 'refs/heads/release-3.0'
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - "24"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Enable Corepack
        shell: bash
        run: corepack enable
      - name: Install locked dependencies
        shell: bash
        run: pnpm install --frozen-lockfile
      - name: Verify committed runtime bundles
        shell: bash
        run: pnpm bundle:check
      - name: Report Claude plugin drift
        shell: bash
        run: pnpm claude:drift
      - name: Lint
        shell: bash
        run: pnpm lint
      - name: Verify release metadata
        shell: bash
        run: pnpm release:check
      - name: Verify source lock
        shell: bash
        run: pnpm source:check
      - name: Build
        shell: bash
        run: pnpm build
      - name: Verify process identity probe
        shell: bash
        run: pnpm process-identity:check
      - name: Test
        shell: bash
        run: pnpm test
      - name: Verify installed runtime
        shell: bash
        run: pnpm runtime:check
      - name: Validate plugin and skills
        shell: bash
        env:
          PYTHONUTF8: "1"
        run: pnpm validate:all
      - name: Validate official Codex metadata with pinned supplier
        shell: bash
        env:
          PYTHONUTF8: "1"
          CODEX_HOME: ${{ runner.temp }}/official-validation-${{ runner.os }}/codex-home
          OFFICIAL_LOG_DIR: ${{ runner.temp }}/official-validation-${{ runner.os }}
        run: |
          set -euo pipefail
          log="${OFFICIAL_LOG_DIR:?}"
          mkdir -p "$log"
          exec > >(tee "$log/step.stdout") 2> >(tee "$log/step.stderr" >&2)
          phase=preparation
          finish() {
            local command_code=$? metadata_code=0 final_code
            trap - EXIT
            set +e
            { git rev-parse HEAD 'HEAD^{tree}' && git status --porcelain=v1; } > "$log/environment-after.txt" || metadata_code=$?
            printf '%s\n' "$command_code" > "$log/$phase-step-exit-code.txt"
            printf '%s\n' "$metadata_code" > "$log/metadata-exit-code.txt"
            printf '%s\n' "$phase" > "$log/last-phase.txt"
            final_code=$command_code
            if [ "$final_code" -eq 0 ]; then final_code=$metadata_code; fi
            printf '%s\n' "$final_code" > "$log/step-exit-code.txt"
            exit "$final_code"
          }
          trap finish EXIT
          printf 'NOT_RUN\n' > "$log/official-status.txt"
          {
            git rev-parse HEAD 'HEAD^{tree}'
            git status --porcelain=v1
            node --version
            pnpm --version
            python --version
            printf 'run=%s attempt=%s ref=%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_REF"
          } > "$log/environment-before.txt"
          python -m pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.3
          python -c 'import sys,yaml; print(sys.version); print(yaml.__version__); print(yaml.__file__); assert sys.version_info[:2] == (3,12) and yaml.__version__ == "6.0.3"' > "$log/python-yaml.txt"
          supplier=10382da79a2a2d6e8ae221fa63077215389c1ad2
          printf '%s\n' "https://github.com/openai/codex" "$supplier" > "$log/supplier-pin.txt"
          mkdir -p "$CODEX_HOME/skills/.system/plugin-creator/scripts" "$CODEX_HOME/skills/.system/skill-creator/scripts" "$CODEX_HOME/.supplier"
          while read -r source destination digest; do
            url="https://raw.githubusercontent.com/openai/codex/$supplier/$source"
            printf 'FETCH %s\n' "$url"
            curl --fail --show-error --silent --location --max-time 60 --proto '=https' "$url" --output "$CODEX_HOME/$destination"
            printf '%s  %s\n' "$digest" "$destination" >> "$log/supplier.sha256"
            (cd "$CODEX_HOME" && printf '%s  %s\n' "$digest" "$destination" | sha256sum --check --strict)
          done <<'SUPPLIER'
          codex-rs/skills/src/assets/samples/plugin-creator/scripts/validate_plugin.py skills/.system/plugin-creator/scripts/validate_plugin.py f4eeadb733b28b0c3e714de263a76d6542866a672f3e99bdffcf4dbcdf85e944
          codex-rs/skills/src/assets/samples/plugin-creator/scripts/identifier_validation.py skills/.system/plugin-creator/scripts/identifier_validation.py a6d51ce4a9a7e8f85626ff5808a467a67574e7f8cdf1167ffb467c5f67e57223
          codex-rs/skills/src/assets/samples/skill-creator/scripts/quick_validate.py skills/.system/skill-creator/scripts/quick_validate.py ee6dba90f44d37171c5a6edb8095979c54919ff6822c1a907afca2e78c48738c
          LICENSE .supplier/LICENSE d17f227e4df5da1600391338865ce0f3055211760a36688f816941d58232d8dc
          NOTICE .supplier/NOTICE 9d71575ecfd9a843fc1677b0efb08053c6ba9fd686a0de1a6f5382fd3c220915
          SUPPLIER
          printf '0\n' > "$log/preparation-exit-code.txt"
          phase=official
          git ls-tree -d --name-only HEAD:skills > "$log/skill-inventory.txt"
          printf 'pnpm run validate:official\n' > "$log/official-command.txt"
          set +e
          pnpm run validate:official > "$log/official.stdout" 2> "$log/official.stderr"
          code=$?
          set -e
          printf '%s\n' "$code" > "$log/official-exit-code.txt"
          printf 'EXECUTED\n' > "$log/official-status.txt"
          cat "$log/official.stdout"
          cat "$log/official.stderr" >&2
          exit "$code"
      - name: Upload official validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-codex-${{ github.run_id }}-${{ github.run_attempt }}-${{ runner.os }}
          path: ${{ runner.temp }}/official-validation-${{ runner.os }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Check pull request whitespace
        if: github.event_name == 'pull_request'
        shell: bash
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
      - name: Check pushed commit whitespace
        if: github.event_name == 'push'
        shell: bash
        run: git show --check --oneline --no-renames HEAD
      - name: Check manually dispatched commit whitespace
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: git show --check --oneline --no-renames HEAD

  verify-release:
    if: github.ref == 'refs/heads/release-3.0' && github.event_name == 'push'
    name: verify-${{ matrix.os }}-shard-${{ matrix.shard }}
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-24.04, windows-2025]
        shard: [1, 2, 3, 4]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      AGS_CI_SHARD_INDEX: ${{ matrix.shard }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Preserve phased evidence
        id: collect
        run: python -B .github/scripts/ags30-owned-command-r06.py .github/scripts/ags30-linux-subreaper-r06.py node .github/scripts/ags30-official-source-r11.mjs .github/ci/ags30-r11/execution-config.json
      - name: Finalize available evidence independently
        id: finalize
        if: ${{ always() }}
        run: node .github/scripts/ags30-official-source-r11.mjs --finalize '${{ steps.collect.outcome }}'
      - name: Return bounded evidence
        if: ${{ always() && steps.finalize.outputs.artifact_ok == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.finalize.outputs.artifact_name }}
          path: ${{ steps.finalize.outputs.result_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
      - name: Verify D0360 Windows write ownership
        if: ${{ always() && matrix.os == 'windows-2025' && matrix.shard == 1 }}
        run: |
          $d0360Root = Join-Path $env:RUNNER_TEMP ('d0360-r01-' + $env:GITHUB_RUN_ID + '-' + $env:GITHUB_RUN_ATTEMPT)
          $d0360Exit = 1
          $PSNativeCommandUseErrorActionPreference = $false
          try {
            & ([Environment]::ProcessPath) -NoLogo -NoProfile -NonInteractive -File .github/ci/d0360-r01/Invoke-Comparison.ps1 -OutputRoot $d0360Root
            $d0360Exit = $LASTEXITCODE
          } finally {
            [IO.Directory]::CreateDirectory($d0360Root) | Out-Null
            $d0360Fsutil = Get-Command fsutil -CommandType Application -ErrorAction SilentlyContinue
            $d0360Runtime = [ordered]@{
              runId = $env:GITHUB_RUN_ID
              runAttempt = $env:GITHUB_RUN_ATTEMPT
              commit = $env:GITHUB_SHA
              os = [Environment]::OSVersion.ToString()
              framework = [Runtime.InteropServices.RuntimeInformation]::FrameworkDescription
              powerShellPath = [Environment]::ProcessPath
              powerShellVersion = $PSVersionTable.PSVersion.ToString()
              powerShellSha256 = (Get-FileHash -LiteralPath ([Environment]::ProcessPath) -Algorithm SHA256).Hash.ToLowerInvariant()
              fsutilPath = if ($d0360Fsutil) { $d0360Fsutil.Source } else { $null }
              fsutilVersion = if ($d0360Fsutil) { (Get-Item -LiteralPath $d0360Fsutil.Source).VersionInfo.FileVersion } else { $null }
              fsutilSha256 = if ($d0360Fsutil) { (Get-FileHash -LiteralPath $d0360Fsutil.Source -Algorithm SHA256).Hash.ToLowerInvariant() } else { $null }
              comparisonExitCode = $d0360Exit
            }
            [IO.File]::WriteAllText((Join-Path $d0360Root 'actions-runtime.json'), ($d0360Runtime | ConvertTo-Json -Depth 5) + [char]10, [Text.UTF8Encoding]::new($false))
          }
          exit $d0360Exit
      - name: Return D0360 Windows ownership evidence
        if: ${{ always() && matrix.os == 'windows-2025' && matrix.shard == 1 }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: d0360-windows-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/d0360-r01-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
