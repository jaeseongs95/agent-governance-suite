name: Verify bounded peer execution preflight

on:
  push:
    branches: [codex/v250-model-routing-integration]

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-peer-preflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      BASE_SHA: b746463b4425a56d8760136926a18890c2e296fc
      EXPECTED_TREE: 548b66e34669f9223b36e448141059d4d88f8e50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify baseline before rebuilding
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$BASE_SHA"
          test -z "$(git status --porcelain)"
          corepack enable
          pnpm install --frozen-lockfile
          pnpm bundle:check
      - name: Restore the exact locally tested source increment
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { brotliDecompressSync } from 'node:zlib';
          import path from 'node:path';
          const hashes = ['837ec63fa74ca13c1f12b9dc3009067f96ce9612','c7ad9876cf3be904d5cfe91bf6a375e5e44b013b','981342b6362a30f9803550904b080baeadd41211'];
          const parts = hashes.map((hash, index) => {
            const b = readFileSync(`.ags-delivery/preflight-${index + 1}.brpart`);
            if (createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${b.length}\0`), b])).digest('hex') !== hash) throw new Error('Transfer hash differs');
            return b;
          });
          const patch = brotliDecompressSync(Buffer.concat(parts), { maxOutputLength: 1024 * 1024 });
          if (createHash('sha256').update(patch).digest('hex') !== '077f8d8c870f646274b70b937c95c79eabc3146eed6ffdc7b96fc7b8093b397d') throw new Error('Source patch differs');
          writeFileSync(path.join(process.env.RUNNER_TEMP, 'preflight.patch'), patch);
          NODE
          git rm -- .ags-delivery/preflight-1.brpart .ags-delivery/preflight-2.brpart .ags-delivery/preflight-3.brpart .github/workflows/verify-peer-preflight-once.yml
          git apply --index --whitespace=error-all "$RUNNER_TEMP/preflight.patch"
          pnpm build
          pnpm claude:build
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          pnpm bundle:check
          pnpm claude:check
          pnpm source:check
          pnpm lint
          pnpm runtime:check
      - name: Focused preflight and existing handoff regression
        id: focused
        shell: bash
        run: |
          pnpm exec vitest run tests/coordinate-subagents/model-routing-v2 tests/mcp/model-routing-service.test.ts tests/mcp/model-routing-workflow.test.mjs tests/mcp/model-routing-host-hook.test.mjs tests/mcp/model-routing-host-install.test.mjs tests/mcp/session-model-capabilities.test.mjs tests/mcp/model-capability-exchange-install.test.mjs tests/mcp/model-peer-handoff.test.mjs tests/mcp/model-peer-install.test.mjs tests/mcp/model-peer-preflight.test.mjs tests/mcp/host-attestation.test.ts tests/mcp/host-attestation-hook.test.ts tests/tooling/claude-plugin.test.mjs tests/runtime/runtime-smoke.test.mjs --reporter=json --outputFile="$RUNNER_TEMP/preflight-focused.json"
      - name: Full regression reported separately
        id: full
        continue-on-error: true
        shell: bash
        run: |
          pnpm test --reporter=json --outputFile="$RUNNER_TEMP/preflight-full.json"
      - name: Publish immutable blobs and exact candidate manifest only
        id: manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FOCUSED_OUTCOME: ${{ steps.focused.outcome }}
          FULL_OUTCOME: ${{ steps.full.outcome }}
        run: |
          set -euo pipefail
          git add -A
          test "$(git write-tree)" = "$EXPECTED_TREE"
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' }).trim();
          const repo = process.env.GITHUB_REPOSITORY;
          if (repo !== 'jaeseongs95/agent-governance-suite' || process.env.GITHUB_REF !== 'refs/heads/codex/v250-model-routing-integration') throw new Error('Unexpected repository or branch');
          const blobHash = b => createHash('sha1').update(Buffer.concat([Buffer.from(`blob ${b.length}\0`),b])).digest('hex');
          async function blob(bytes) {
            const response = await fetch(`https://api.github.com/repos/${repo}/git/blobs`, {
              method: 'POST', signal: AbortSignal.timeout(45000),
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: bytes.toString('base64'), encoding: 'base64' }),
            });
            if (!response.ok) throw new Error(`Blob publication HTTP ${response.status}`);
            const result = await response.json();
            if (result.sha !== blobHash(bytes)) throw new Error('Published blob differs');
            return result.sha;
          }
          const changed = execFileSync('git', ['diff','--cached','--name-status','--no-renames','-z',process.env.BASE_SHA], {encoding:'utf8'}).split('\0').filter(Boolean);
          if (changed.length !== 24) throw new Error('Expected exactly 12 candidate files');
          const entries = [];
          for (let i=0;i<changed.length;i+=2) {
            const status=changed[i],file=changed[i+1];
            if (!['A','M'].includes(status) || file.startsWith('/') || file.split('/').includes('..')) throw new Error('Unexpected source change');
            const bytes=readFileSync(file), mode=git('ls-files','--stage','--',file).split(' ')[0];
            if (mode !== '100644' || git('rev-parse',`:${file}`) !== blobHash(bytes)) throw new Error('Unstaged candidate bytes');
            entries.push({path:file,mode,type:'blob',sha:await blob(bytes)});
          }
          function summary(file,outcome) {
            const r=JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP,file),'utf8'));
            return {outcome,success:r.success,total:r.numTotalTests,passed:r.numPassedTests,failed:r.numFailedTests,pending:r.numPendingTests};
          }
          const manifest={schemaVersion:1,repository:repo,branch:'codex/v250-model-routing-integration',baseCommit:process.env.BASE_SHA,
            deliveryCommit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,node:process.version,
            baseTree:git('rev-parse',`${process.env.BASE_SHA}^{tree}`),expectedTree:process.env.EXPECTED_TREE,
            sourcePatchSha256:'077f8d8c870f646274b70b937c95c79eabc3146eed6ffdc7b96fc7b8093b397d',
            focused:summary('preflight-focused.json',process.env.FOCUSED_OUTCOME),full:summary('preflight-full.json',process.env.FULL_OUTCOME),branchUpdated:false,entries};
          const bytes=Buffer.from(JSON.stringify(manifest,null,2)+'\n');
          writeFileSync(path.join(process.env.RUNNER_TEMP,'preflight-manifest.json'),bytes);
          const sha=await blob(bytes);appendFileSync(process.env.GITHUB_OUTPUT,`sha=${sha}\n`);
          console.log(`MANIFEST_BLOB=${sha}; no tree, commit or ref was published by this job`);
          NODE
      - name: Verified preflight manifest ${{ steps.manifest.outputs.sha }}
        run: echo 'The connector finalizes the exact tested tree; this workflow never moves a ref.'
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peer-preflight-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/preflight-focused.json
            ${{ runner.temp }}/preflight-full.json
            ${{ runner.temp }}/preflight-manifest.json
          if-no-files-found: warn
          retention-days: 14
