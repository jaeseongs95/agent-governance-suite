name: Antigravity package

# Attach the Antigravity (agy) install copies (Korean and English) to every published release.
# workflow_dispatch rebuilds and replaces it for an existing release tag.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to package (for example v3.2.1)
        required: true

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Build and attach the package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/agent-governance-suite-antigravity-$TAG.zip"
          out_en="$RUNNER_TEMP/agent-governance-suite-antigravity-$TAG-en.zip"
          node scripts/build-antigravity-package.mjs --ref "refs/tags/$TAG" --out "$out"
          node scripts/build-antigravity-package.mjs --ref "refs/tags/$TAG" --out "$out_en" --locale en
          gh release upload "$TAG" "$out" "$out_en" --clobber
